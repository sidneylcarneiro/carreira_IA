{% extends "base.html" %}
{% block title %}Segurança{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow-md p-6 max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Segurança</h1>
    <p class="text-sm text-gray-500 mb-6">Altere sua senha de acesso.</p>

    {% if not usuario.senha_hash %}
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
        <p class="text-sm text-blue-800">
            Sua conta é vinculada ao Google. A alteração de senha deve ser feita lá.
        </p>
    </div>
    {% else %}
    <form method="post" action="/seguranca" class="space-y-4">
        <div>
            <label for="senha_atual" class="block text-sm font-medium text-gray-700 mb-1">Senha atual:</label>
            <input
                type="password"
                id="senha_atual"
                name="senha_atual"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
        </div>
        <div>
            <label for="nova_senha" class="block text-sm font-medium text-gray-700 mb-1">Nova senha:</label>
            <input
                type="password"
                id="nova_senha"
                name="nova_senha"
                required
                minlength="6"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
            <p class="mt-1 text-xs text-gray-500">Mínimo de 6 caracteres.</p>
        </div>
        <div>
            <label for="confirmar_senha" class="block text-sm font-medium text-gray-700 mb-1">Confirmar nova senha:</label>
            <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                required
                minlength="6"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
        </div>
        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors"
        >
            Alterar Senha
        </button>
    </form>
    {% endif %}
</div>
{% endblock %}
