{% extends "base.html" %}
{% block title %}Meu Perfil{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow-md p-6 max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Meu Perfil</h1>
    <p class="text-sm text-gray-500 mb-6">Atualize seus dados de contato.</p>

    {% if sucesso %}
    <div class="bg-green-50 border border-green-200 rounded-md p-3 mb-4 text-sm text-green-800" role="alert">
        ✔ Perfil atualizado com sucesso!
    </div>
    {% endif %}

    <form method="post" action="/perfil" class="space-y-4">
        <div>
            <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
                value="{{ usuario.nome or '' }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ usuario.email or '' }}"
                readonly
                class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100 text-gray-500 cursor-not-allowed"
            >
            <p class="mt-1 text-xs text-gray-400">O e-mail é usado para login e não pode ser alterado aqui.</p>
        </div>
        <div>
            <label for="telefone" class="block text-sm font-medium text-gray-700 mb-1">Telefone:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                value="{{ usuario.telefone or '' }}"
                placeholder="(00) 00000-0000"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
        </div>
        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors"
        >
            Salvar Alterações
        </button>
    </form>
</div>
{% endblock %}
