{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow-md p-6 max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Entrar</h1>

    {% if erro %}
    <p class="mb-4 text-sm text-red-600">{{ erro }}</p>
    {% endif %}

    <a href="/login/google" class="flex items-center justify-center gap-3 w-full px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuar com o Google
    </a>

    <div class="flex items-center my-5">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="mx-3 text-sm text-gray-500">ou</span>
        <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha:</label>
            <input type="password" id="senha" name="senha" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">
            Entrar
        </button>
    </form>

    <p class="mt-4 text-sm text-gray-600">
        Não tem conta? <a href="/registro" class="text-blue-600 hover:underline">Cadastre-se</a>.
    </p>
</div>
{% endblock %}
