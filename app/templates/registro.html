{% extends "base.html" %}
{% block title %}Cadastrar{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow-md p-6 max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Criar Conta</h1>

    {% if erro %}
    <p class="mb-4 text-sm text-red-600">{{ erro }}</p>
    {% endif %}

    <form method="post" action="/registro" class="space-y-4">
        <div>
            <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome:</label>
            <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha:</label>
            <input type="password" id="senha" name="senha" required minlength="6"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p class="mt-1 text-xs text-gray-500">Mínimo de 6 caracteres. Você recebe 10 créditos de cada tipo.</p>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">
            Cadastrar
        </button>
    </form>

    <p class="mt-4 text-sm text-gray-600">
        Já tem conta? <a href="/login" class="text-blue-600 hover:underline">Entrar</a>.
    </p>
</div>
{% endblock %}
