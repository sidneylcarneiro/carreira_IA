{% extends "base.html" %}
{% block title %}Analisar Vaga{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Análise de Vaga com IA</h1>

    <!-- Formulário para enviar a vaga -->
    <form
        hx-post="/analisar-vaga"
        hx-target="#resultado"
        hx-swap="innerHTML"
        class="space-y-4"
    >
        <!-- Abas para escolher entre colar texto ou URL -->
        <div class="flex space-x-2 mb-4" role="tablist" aria-label="Origem da vaga">
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="modo" value="texto" class="peer sr-only" checked onchange="toggleModoVaga('texto')">
                <span class="block text-center py-2 px-4 rounded-md text-sm font-medium bg-gray-200 text-gray-700 peer-checked:bg-blue-600 peer-checked:text-white transition-colors">
                    Colar Texto
                </span>
            </label>
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="modo" value="url" class="peer sr-only" onchange="toggleModoVaga('url')">
                <span class="block text-center py-2 px-4 rounded-md text-sm font-medium bg-gray-200 text-gray-700 peer-checked:bg-blue-600 peer-checked:text-white transition-colors">
                    Colar URL
                </span>
            </label>
        </div>

        <!-- Campo de texto (aba "Colar Texto") -->
        <div id="campo_texto">
            <label for="vaga_texto" class="block text-sm font-medium text-gray-700 mb-1">Texto da Vaga:</label>
            <textarea
                id="vaga_texto"
                name="vaga_texto"
                rows="8"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Cole aqui o texto completo da descrição da vaga..."
            ></textarea>
        </div>

        <!-- Campo de URL (aba "Colar URL") -->
        <div id="campo_url" class="hidden">
            <label for="vaga_url" class="block text-sm font-medium text-gray-700 mb-1">URL da Vaga:</label>
            <input
                type="url"
                id="vaga_url"
                name="vaga_url"
                disabled
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="https://exemplo.com.br/vagas/desenvolvedor-python"
            >
            <p class="mt-1 text-xs text-gray-500">Informe o link da página da vaga. O conteúdo será extraído automaticamente.</p>
        </div>

        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors"
        >
            Analisar Vaga com IA (1 crédito de vaga)
        </button>
    </form>

    <!-- Área onde o resultado será exibido -->
    <div id="resultado" class="mt-6 p-4 border border-gray-200 rounded-md bg-gray-50">
        <p class="text-gray-500">O resultado da análise aparecerá aqui após o envio.</p>
    </div>
</div>
<script>
    // Alterna entre as abas "Colar Texto" e "Colar URL", garantindo que
    // apenas o campo ativo seja enviado no formulário (o campo inativo é desabilitado).
    function toggleModoVaga(modo) {
        const campoTexto = document.getElementById('campo_texto');
        const campoUrl = document.getElementById('campo_url');
        const textarea = document.getElementById('vaga_texto');
        const inputUrl = document.getElementById('vaga_url');

        if (modo === 'texto') {
            campoTexto.classList.remove('hidden');
            campoUrl.classList.add('hidden');
            textarea.disabled = false;
            textarea.required = true;
            inputUrl.disabled = true;
            inputUrl.required = false;
        } else {
            campoTexto.classList.add('hidden');
            campoUrl.classList.remove('hidden');
            textarea.disabled = true;
            textarea.required = false;
            inputUrl.disabled = false;
            inputUrl.required = true;
        }
    }
</script>
{% endblock %}
