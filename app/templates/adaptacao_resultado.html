<!-- adaptacao_resultado.html -->
{% if sucesso %}
<!-- Fragmento substitui a célula de ações (#acao-<vaga_id>) via hx-swap=innerHTML.
     O container pai já é flex, então devolvemos os botões como filhos diretos,
     exatamente como o dashboard.html renderiza quando a adaptação já existe. -->
<a href="/vagas/{{ vaga.id }}" class="inline-block bg-gray-600 text-white px-3 py-1.5 rounded-md hover:bg-gray-700">
    Ver Análise
</a>
<a href="/adaptacao/{{ adaptacao.id }}" class="inline-block bg-blue-600 text-white px-3 py-1.5 rounded-md hover:bg-blue-700">
    Visualizar
</a>
<a href="/baixar-adaptacao/{{ adaptacao.id }}" class="inline-block bg-green-600 text-white px-3 py-1.5 rounded-md hover:bg-green-700">
    Baixar
</a>
{% if vaga.url_original %}
    <a href="{{ vaga.url_original }}" target="_blank" rel="noopener" class="inline-block text-blue-600 hover:underline text-sm">
        Vaga original
    </a>
{% endif %}
<span id="creditos_adaptacao" hx-swap-oob="outerHTML" class="px-2 py-1 bg-purple-100 text-purple-700 rounded-md">Adaptações: {{ usuario.creditos_adaptacao }}</span>
{% else %}
<div class="bg-red-50 border border-red-200 rounded-lg p-4" role="alert">
    <h2 class="text-lg font-semibold text-red-800 mb-2">Não foi possível gerar a adaptação</h2>
    <p class="text-sm text-red-700">{{ mensagem }}</p>
</div>
<span id="creditos_adaptacao" hx-swap-oob="outerHTML" class="px-2 py-1 bg-purple-100 text-purple-700 rounded-md">Adaptações: {{ usuario.creditos_adaptacao }}</span>
{% endif %}
